<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Math AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  min-height:100vh;
  color:white;
  background:
    radial-gradient(circle at top left,#172c66 0%,transparent 35%),
    radial-gradient(circle at bottom right,#391c68 0%,transparent 35%),
    #07111f;
}

.container{
  width:min(1000px,92%);
  margin:auto;
}

header{
  padding:24px 0;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:28px;
  font-weight:900;
}

.logo span{
  color:#809cff;
}

.badge{
  padding:9px 14px;
  border-radius:30px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1);
  color:#cbd7ea;
  font-size:13px;
}

.hero{
  text-align:center;
  padding:45px 0 35px;
}

.hero h1{
  max-width:850px;
  margin:auto;
  font-size:clamp(37px,7vw,70px);
  line-height:1.05;
}

.hero h1 span{
  background:linear-gradient(
    90deg,
    #7297ff,
    #a77cff,
    #64e4f5
  );
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.hero p{
  max-width:650px;
  margin:22px auto 0;
  color:#9eacc2;
  line-height:1.6;
}

.card{
  max-width:850px;
  margin:15px auto 70px;
  padding:30px;
  border-radius:28px;
  background:rgba(13,27,49,.86);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 30px 90px rgba(0,0,0,.35);
}

.card h2{
  margin-bottom:7px;
}

.sub{
  color:#91a1b7;
  font-size:14px;
  margin-bottom:25px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:17px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.full{
  grid-column:1/-1;
}

label{
  font-size:14px;
  font-weight:bold;
  color:#dbe4f3;
}

input,
select,
textarea{
  width:100%;
  padding:15px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.12);
  background:#111f36;
  color:white;
  font-size:15px;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#718cff;
  box-shadow:0 0 0 3px rgba(100,130,255,.12);
}

select option{
  color:black;
}

textarea{
  min-height:100px;
  resize:vertical;
}

button{
  width:100%;
  margin-top:23px;
  padding:17px;
  border:0;
  border-radius:15px;
  color:white;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
  background:linear-gradient(90deg,#5e7dff,#8e61ff);
  box-shadow:0 12px 35px rgba(90,100,255,.25);
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

#status{
  display:none;
  margin-top:16px;
  padding:14px;
  text-align:center;
  border-radius:13px;
  background:rgba(105,130,255,.1);
  color:#dbe4ff;
}

#progressWrap{
  display:none;
  margin-top:12px;
  height:8px;
  border-radius:20px;
  overflow:hidden;
  background:rgba(255,255,255,.08);
}

#progress{
  width:0;
  height:100%;
  background:linear-gradient(90deg,#5e7dff,#9a68ff);
  transition:.35s;
}

.features{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:22px;
}

.feature{
  padding:13px;
  text-align:center;
  border-radius:13px;
  background:rgba(255,255,255,.035);
  color:#9faec3;
  font-size:13px;
}

@media(max-width:700px){

  .grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .card{
    padding:21px;
  }

  .features{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="container">

<header>

  <div class="logo">
    Math<span>AI</span>
  </div>

  <div class="badge">
    AI Presentation
  </div>

</header>


<section class="hero">

  <h1>
    Математика сабагына
    <span>AI презентация</span>
  </h1>

  <p>
    Теманы жана классты тандаңыз.
    AI сабактын мазмунун түзүп,
    заманбап презентацияны автоматтык даярдайт.
  </p>

</section>


<div class="card">

<h2>Жаңы презентация</h2>

<div class="sub">
  Керектүү маалыматтарды толтуруңуз
</div>


<form id="presentationForm">

<div class="grid">


<div class="field">

<label>Класс</label>

<select id="grade" required>

<option value="">
Тандаңыз
</option>

<option>5-класс</option>
<option>6-класс</option>
<option>7-класс</option>
<option>8-класс</option>
<option>9-класс</option>
<option>10-класс</option>
<option>11-класс</option>

</select>

</div>


<div class="field">

<label>Слайд саны</label>

<select id="slides">

<option value="6">
6 слайд
</option>

<option value="8">
8 слайд
</option>

<option value="10" selected>
10 слайд
</option>

<option value="12">
12 слайд
</option>

<option value="15">
15 слайд
</option>

</select>

</div>


<div class="field">

<label>Тил</label>

<select id="language">

<option value="Кыргызча">
Кыргызча
</option>

<option value="Русский">
Русский
</option>

</select>

</div>


<div class="field">

<label>Дизайн</label>

<select id="style">

<option value="VIP">
VIP
</option>

<option value="Заманбап">
Заманбап
</option>

<option value="Минималисттик">
Минималисттик
</option>

<option value="Мектептик">
Мектептик
</option>

</select>

</div>


<div class="field full">

<label>
Сабактын темасы
</label>

<input
id="topic"
placeholder="Мисалы: Квадраттык теңдемелер"
required>

</div>


<div class="field full">

<label>
Кошумча талап
</label>

<textarea
id="extra"
placeholder="Мисалы: формулалар, мисалдар жана тапшырмалар кошулсун"></textarea>

</div>

</div>


<button
id="generateBtn"
type="submit">

✨ AI менен презентация түзүү

</button>


<div id="status"></div>


<div id="progressWrap">

<div id="progress"></div>

</div>


<div class="features">

<div class="feature">
⚡ Тез даярдалат
</div>

<div class="feature">
◆ VIP дизайн
</div>

<div class="feature">
PDF сактоо
</div>

</div>

</form>

</div>

</div>


<script>

const form =
document.getElementById(
  "presentationForm"
);

const btn =
document.getElementById(
  "generateBtn"
);

const statusBox =
document.getElementById(
  "status"
);

const progressWrap =
document.getElementById(
  "progressWrap"
);

const progress =
document.getElementById(
  "progress"
);


function updateStatus(
  text,
  percent
){

  statusBox.style.display =
  "block";

  statusBox.textContent =
  text;

  progressWrap.style.display =
  "block";

  progress.style.width =
  percent + "%";
}



form.addEventListener(
"submit",
async function(e){

  e.preventDefault();


  const grade =
  document.getElementById(
    "grade"
  ).value;


  const slides =
  document.getElementById(
    "slides"
  ).value;


  const language =
  document.getElementById(
    "language"
  ).value;


  const style =
  document.getElementById(
    "style"
  ).value;


  const topic =
  document.getElementById(
    "topic"
  ).value.trim();


  const extra =
  document.getElementById(
    "extra"
  ).value.trim();



  if(!grade){

    alert(
      "Классты тандаңыз"
    );

    return;
  }


  if(!topic){

    alert(
      "Сабактын темасын жазыңыз"
    );

    return;
  }



  const formData = {

    grade:grade,

    slides:slides,

    language:language,

    style:style,

    topic:topic,

    extra:extra

  };



  btn.disabled = true;

  btn.textContent =
  "AI даярдап жатат...";


  updateStatus(
    "AI сабактын мазмунун түзүп жатат...",
    25
  );


  try{


    const response =
    await fetch(
      "/api/generate",
      {

        method:"POST",

        headers:{
          "Content-Type":
          "application/json"
        },

        body:
        JSON.stringify(
          formData
        )

      }
    );


    updateStatus(
      "Слайддар даярдалууда...",
      65
    );


    const result =
    await response.json();


    if(!response.ok){

      throw new Error(
        result.error ||
        "AI ката берди"
      );

    }



    const generatedSlides =
    result?.presentation?.slides;


    if(
      !Array.isArray(
        generatedSlides
      ) ||
      !generatedSlides.length
    ){

      throw new Error(
        "AI слайддарды кайтарган жок"
      );

    }



    /*
      ЭСКИ ПРЕЗЕНТАЦИЯНЫ
      ТАЗАЛАЙБЫЗ
    */

    localStorage.removeItem(
      "math_ai_presentation"
    );



    /*
      ЖАҢЫ ПРЕЗЕНТАЦИЯНЫ
      САКТАЙБЫЗ
    */

    localStorage.setItem(
      "math_ai_presentation",
      JSON.stringify(result)
    );



    updateStatus(
      "Презентация даяр ✓",
      100
    );


    btn.textContent =
    "Даяр ✓";



    /*
      ЭЧ КАНДАЙ СҮРӨТ API ЖОК.

      ДАРОО ПРЕЗЕНТАЦИЯГА
      ӨТӨБҮЗ.
    */

    setTimeout(
      function(){

        window.location.href =
        "./presentation.html";

      },
      400
    );


  }
  catch(error){


    console.error(error);


    statusBox.style.display =
    "block";


    statusBox.textContent =
    "Ката: " +
    error.message;


    progressWrap.style.display =
    "none";


    btn.disabled =
    false;


    btn.textContent =
    "✨ AI менен презентация түзүү";

  }

});

</script>

</body>
</html>
