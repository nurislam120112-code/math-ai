<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>School AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  min-height:100vh;
  color:white;
  background:
    radial-gradient(circle at 15% 15%,rgba(55,105,255,.22),transparent 30%),
    radial-gradient(circle at 85% 20%,rgba(145,60,255,.18),transparent 28%),
    radial-gradient(circle at 50% 90%,rgba(0,210,255,.12),transparent 35%),
    #06101e;
}

.container{
  width:min(1050px,92%);
  margin:auto;
}

header{
  padding:24px 0;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:29px;
  font-weight:900;
}

.logo span{
  background:linear-gradient(90deg,#7195ff,#aa73ff,#63e5ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.badge{
  padding:9px 14px;
  border-radius:30px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.11);
  color:#cad6e9;
  font-size:13px;
}

.hero{
  text-align:center;
  padding:40px 0 34px;
}

.hero h1{
  font-size:clamp(38px,7vw,72px);
  line-height:1.03;
  max-width:900px;
  margin:auto;
}

.hero h1 span{
  background:linear-gradient(90deg,#6f92ff,#aa72ff,#58dff7);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.hero p{
  max-width:700px;
  margin:22px auto 0;
  color:#9baac0;
  line-height:1.6;
  font-size:16px;
}

.card{
  position:relative;
  overflow:hidden;
  max-width:900px;
  margin:15px auto 70px;
  padding:30px;
  border-radius:30px;
  background:rgba(11,25,45,.88);
  border:1px solid rgba(255,255,255,.09);
  box-shadow:0 30px 90px rgba(0,0,0,.4);
}

.card::before{
  content:"";
  position:absolute;
  width:280px;
  height:280px;
  border-radius:50%;
  background:#455dff;
  filter:blur(110px);
  opacity:.12;
  top:-130px;
  right:-100px;
}

.card h2{
  position:relative;
  font-size:25px;
  margin-bottom:7px;
}

.sub{
  position:relative;
  color:#91a1b7;
  font-size:14px;
  margin-bottom:25px;
}

.grid{
  position:relative;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:17px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.full{
  grid-column:1/-1;
}

label{
  font-size:14px;
  font-weight:700;
  color:#dbe4f3;
}

input,
select,
textarea{
  width:100%;
  padding:15px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.11);
  background:#101f36;
  color:white;
  font-size:15px;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#7690ff;
  box-shadow:0 0 0 3px rgba(100,130,255,.11);
}

select option{
  color:black;
}

textarea{
  min-height:100px;
  resize:vertical;
}

button{
  position:relative;
  width:100%;
  margin-top:23px;
  padding:17px;
  border:0;
  border-radius:15px;
  color:white;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
  background:linear-gradient(90deg,#5878ff,#905dff,#4ccff0);
  box-shadow:0 15px 40px rgba(90,100,255,.28);
}

button:disabled{
  opacity:.6;
}

#status{
  display:none;
  position:relative;
  margin-top:16px;
  padding:14px;
  text-align:center;
  border-radius:13px;
  background:rgba(105,130,255,.1);
  color:#dbe4ff;
}

#progressWrap{
  display:none;
  margin-top:12px;
  height:8px;
  border-radius:20px;
  overflow:hidden;
  background:rgba(255,255,255,.08);
}

#progress{
  width:0;
  height:100%;
  background:linear-gradient(90deg,#5878ff,#9b63ff,#53daf5);
  transition:.35s;
}

.features{
  position:relative;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:22px;
}

.feature{
  padding:13px;
  border-radius:13px;
  text-align:center;
  color:#9faec3;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.04);
  font-size:13px;
}

@media(max-width:700px){
  .grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .card{
    padding:21px;
  }

  .features{
    grid-template-columns:1fr;
  }

  .badge{
    display:none;
  }
}
</style>
</head>

<body>

<div class="container">

<header>

  <div class="logo">
    School<span>AI</span>
  </div>

  <div class="badge">
    AI Presentation Maker
  </div>

</header>


<section class="hero">

  <h1>
    Мектеп сабактарына
    <span>AI презентация</span>
  </h1>

  <p>
    Предметти, классты жана теманы тандаңыз.
    AI сабактын мазмунун түзүп, кооз презентация даярдайт.
  </p>

</section>


<div class="card">

<h2>Жаңы презентация</h2>

<div class="sub">
  Сабак тууралуу маалыматтарды толтуруңуз
</div>


<form id="presentationForm">

<div class="grid">


<div class="field">

<label>Предмет</label>

<select id="subject" required>

<option value="">
Предметти тандаңыз
</option>

<option value="Математика">Математика</option>
<option value="Алгебра">Алгебра</option>
<option value="Геометрия">Геометрия</option>
<option value="Физика">Физика</option>
<option value="Химия">Химия</option>
<option value="Биология">Биология</option>
<option value="География">География</option>
<option value="Тарых">Тарых</option>
<option value="Кыргыз тили">Кыргыз тили</option>
<option value="Кыргыз адабияты">Кыргыз адабияты</option>
<option value="Орус тили">Орус тили</option>
<option value="Орус адабияты">Орус адабияты</option>
<option value="Англис тили">Англис тили</option>
<option value="Информатика">Информатика</option>
<option value="Астрономия">Астрономия</option>
<option value="Адам жана коом">Адам жана коом</option>
<option value="Жаратылыш таануу">Жаратылыш таануу</option>
<option value="Экология">Экология</option>
<option value="Экономика">Экономика</option>
<option value="Укук">Укук</option>
<option value="Музыка">Музыка</option>
<option value="Көркөм өнөр">Көркөм өнөр</option>
<option value="Дене тарбия">Дене тарбия</option>
<option value="Технология">Технология</option>

</select>

</div>


<div class="field">

<label>Класс</label>

<select id="grade" required>

<option value="">
Классты тандаңыз
</option>

<option>1-класс</option>
<option>2-класс</option>
<option>3-класс</option>
<option>4-класс</option>
<option>5-класс</option>
<option>6-класс</option>
<option>7-класс</option>
<option>8-класс</option>
<option>9-класс</option>
<option>10-класс</option>
<option>11-класс</option>

</select>

</div>


<div class="field">

<label>Слайд саны</label>

<select id="slides">

<option value="6">6 слайд</option>
<option value="8">8 слайд</option>
<option value="10" selected>10 слайд</option>
<option value="12">12 слайд</option>
<option value="15">15 слайд</option>

</select>

</div>


<div class="field">

<label>Тил</label>

<select id="language">

<option value="Кыргызча">
Кыргызча
</option>

<option value="Русский">
Русский
</option>

</select>

</div>


<div class="field">

<label>Дизайн</label>

<select id="style">

<option value="VIP">
VIP
</option>

<option value="Неон">
Неон
</option>

<option value="Заманбап">
Заманбап
</option>

<option value="Минималисттик">
Минималисттик
</option>

<option value="Мектептик">
Мектептик
</option>

</select>

</div>


<div class="field">

<label>Сабактын түрү</label>

<select id="lessonType">

<option value="Жаңы тема">
Жаңы тема
</option>

<option value="Кайталоо">
Кайталоо
</option>

<option value="Практикалык сабак">
Практикалык сабак
</option>

<option value="Ачык сабак">
Ачык сабак
</option>

<option value="Жыйынтык сабак">
Жыйынтык сабак
</option>

</select>

</div>


<div class="field full">

<label>Сабактын темасы</label>

<input
id="topic"
placeholder="Мисалы: Клетканын түзүлүшү"
required>

</div>


<div class="field full">

<label>Кошумча талап</label>

<textarea
id="extra"
placeholder="Мисалы: кызыктуу фактылар, мисалдар жана суроолор кошулсун"></textarea>

</div>

</div>


<button
id="generateBtn"
type="submit">

✨ AI менен презентация түзүү

</button>


<div id="status"></div>

<div id="progressWrap">
  <div id="progress"></div>
</div>


<div class="features">

<div class="feature">
⚡ Тез даярдалат
</div>

<div class="feature">
✦ Ар түрдүү дизайн
</div>

<div class="feature">
PDF сактоо
</div>

</div>

</form>

</div>

</div>


<script>

const form =
document.getElementById("presentationForm");

const btn =
document.getElementById("generateBtn");

const statusBox =
document.getElementById("status");

const progressWrap =
document.getElementById("progressWrap");

const progress =
document.getElementById("progress");


function updateStatus(text,percent){

  statusBox.style.display =
  "block";

  statusBox.textContent =
  text;

  progressWrap.style.display =
  "block";

  progress.style.width =
  percent + "%";
}


form.addEventListener(
"submit",
async function(e){

  e.preventDefault();


  const subject =
  document.getElementById(
    "subject"
  ).value;


  const grade =
  document.getElementById(
    "grade"
  ).value;


  const slides =
  document.getElementById(
    "slides"
  ).value;


  const language =
  document.getElementById(
    "language"
  ).value;


  const style =
  document.getElementById(
    "style"
  ).value;


  const lessonType =
  document.getElementById(
    "lessonType"
  ).value;


  const topic =
  document.getElementById(
    "topic"
  ).value.trim();


  const extra =
  document.getElementById(
    "extra"
  ).value.trim();


  if(!subject){

    alert(
      "Предметти тандаңыз"
    );

    return;
  }


  if(!grade){

    alert(
      "Классты тандаңыз"
    );

    return;
  }


  if(!topic){

    alert(
      "Сабактын темасын жазыңыз"
    );

    return;
  }


  const formData = {

    subject:subject,

    grade:grade,

    slides:slides,

    language:language,

    style:style,

    lessonType:lessonType,

    topic:topic,

    extra:extra

  };


  btn.disabled = true;

  btn.textContent =
  "AI даярдап жатат...";


  updateStatus(
    subject +
    " сабагы даярдалууда...",
    20
  );


  try{


    const response =
    await fetch(
      "/api/generate",
      {

        method:"POST",

        headers:{
          "Content-Type":
          "application/json"
        },

        body:
        JSON.stringify(
          formData
        )

      }
    );


    updateStatus(
      "Слайддардын мазмуну түзүлүүдө...",
      65
    );


    const result =
    await response.json();


    if(!response.ok){

      throw new Error(
        result.error ||
        "AI ката берди"
      );

    }


    const generatedSlides =
    result?.presentation?.slides;


    if(
      !Array.isArray(
        generatedSlides
      ) ||
      !generatedSlides.length
    ){

      throw new Error(
        "Слайддар келген жок"
      );

    }


    /*
      ПРЕДМЕТТИ ДА
      ПРЕЗЕНТАЦИЯГА САКТАЙБЫЗ
    */

    if(result.presentation){

      result.presentation.subject =
      subject;

      result.presentation.grade =
      grade;

      result.presentation.style =
      style;

      result.presentation.lessonType =
      lessonType;

      result.presentation.language =
      language;

    }


    localStorage.removeItem(
      "math_ai_presentation"
    );


    localStorage.setItem(
      "math_ai_presentation",
      JSON.stringify(result)
    );


    updateStatus(
      "Презентация даяр ✓",
      100
    );


    btn.textContent =
    "Даяр ✓";


    setTimeout(
      function(){

        window.location.href =
        "./presentation.html";

      },
      400
    );


  }
  catch(error){


    console.error(error);


    statusBox.style.display =
    "block";


    statusBox.textContent =
    "Ката: " +
    error.message;


    progressWrap.style.display =
    "none";


    btn.disabled =
    false;


    btn.textContent =
    "✨ AI менен презентация түзүү";

  }

});

</script>

</body>
</html>
