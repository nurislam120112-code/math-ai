<script>
const form = document.getElementById("presentationForm");
const btn = document.getElementById("generateBtn");
const statusBox = document.getElementById("status");
const progressWrap = document.getElementById("progressWrap");
const progress = document.getElementById("progress");

function updateStatus(text, percent) {
  statusBox.style.display = "block";
  statusBox.textContent = text;

  progressWrap.style.display = "block";
  progress.style.width = percent + "%";
}

async function createImage(prompt) {
  try {
    const response = await fetch("/api/image", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ prompt })
    });

    const data = await response.json();

    if (response.ok && data.success && data.image) {
      return data.image;
    }

    console.error("Image API:", data);
    return null;

  } catch (error) {
    console.error("Image error:", error);
    return null;
  }
}

/* 3 СҮРӨТТҮ БИР УЧУРДА ДАЯРДАЙТ */
async function generateImagesInBatches(slides) {

  const batchSize = 3;

  for (let start = 0; start < slides.length; start += batchSize) {

    const batch = slides.slice(start, start + batchSize);

    updateStatus(
      `AI сүрөттөрдү даярдап жатат: ${start + 1}–${Math.min(
        start + batch.length,
        slides.length
      )} / ${slides.length}`,
      20 + Math.round((start / slides.length) * 70)
    );

    const results = await Promise.all(
      batch.map(async (slide, batchIndex) => {

        const realIndex = start + batchIndex;

        if (!slide.imagePrompt) {
          return {
            index: realIndex,
            image: null
          };
        }

        const image = await createImage(slide.imagePrompt);

        return {
          index: realIndex,
          image
        };
      })
    );

    for (const result of results) {

      if (!result.image) continue;

      try {
        sessionStorage.setItem(
          `math_ai_image_${result.index}`,
          result.image
        );
      } catch (error) {
        console.warn(
          `Сүрөт ${result.index + 1} cache'ге баткан жок`
        );
      }
    }

    const completed = Math.min(
      start + batch.length,
      slides.length
    );

    updateStatus(
      `Даяр: ${completed} / ${slides.length} сүрөт`,
      20 + Math.round((completed / slides.length) * 75)
    );
  }
}

form.addEventListener("submit", async (e) => {

  e.preventDefault();

  const data = {
    grade: document.getElementById("grade").value,
    slides: document.getElementById("slides").value,
    language: document.getElementById("language").value,
    style: document.getElementById("style").value,
    topic: document.getElementById("topic").value,
    extra: document.getElementById("extra").value
  };

  btn.disabled = true;
  btn.textContent = "Презентация даярдалууда...";

  updateStatus(
    "AI слайддардын текстин түзүп жатат...",
    5
  );

  try {

    /* 1. ТЕКСТТИ ДАЯРДАЙБЫЗ */

    const response = await fetch("/api/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(
        result.error || "Презентация түзүлгөн жок"
      );
    }

    const slides =
      result?.presentation?.slides || [];

    if (!slides.length) {
      throw new Error("Слайддар табылган жок");
    }

    localStorage.setItem(
      "math_ai_presentation",
      JSON.stringify(result)
    );

    /* 2. МУРУНКУ СҮРӨТТӨРДҮ ТАЗАЛАЙБЫЗ */

    for (let i = 0; i < 30; i++) {
      sessionStorage.removeItem(
        `math_ai_image_${i}`
      );
    }

    updateStatus(
      "Текст даяр. AI сүрөттөрдү түзүп жатат...",
      20
    );

    /* 3. 3 СҮРӨТТӨН ПАРАЛЛЕЛДҮҮ */

    await generateImagesInBatches(slides);

    /* 4. ДАЯР */

    updateStatus(
      "Презентация толугу менен даяр!",
      100
    );

    btn.textContent = "Даяр ✓";

    setTimeout(() => {
      window.location.href = "presentation.html";
    }, 500);

  } catch (error) {

    console.error(error);

    statusBox.style.display = "block";

    statusBox.textContent =
      "Ката: " + error.message;

    progressWrap.style.display = "none";

    btn.disabled = false;

    btn.textContent =
      "✨ AI менен презентация түзүү";
  }
});
</script>
