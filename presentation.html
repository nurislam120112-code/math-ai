<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Math AI Presentation</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#06101d;
  color:white;
  min-height:100vh;
  overflow-x:hidden;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 22px;
}

.logo{
  font-size:24px;
  font-weight:900;
}

.logo span{
  color:#8097ff;
}

.actions{
  display:flex;
  gap:10px;
}

button{
  border:none;
  border-radius:12px;
  padding:11px 16px;
  cursor:pointer;
  font-weight:700;
}

.back-btn{
  background:#18243a;
  color:white;
}

.pdf-btn{
  background:linear-gradient(90deg,#5f7cff,#8d62ff);
  color:white;
}

.viewer{
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.slide{
  width:min(1200px,94vw);
  aspect-ratio:16/9;
  border-radius:28px;
  overflow:hidden;
  position:relative;

  background:
    radial-gradient(circle at 20% 20%,rgba(70,120,255,.25),transparent 30%),
    radial-gradient(circle at 80% 80%,rgba(150,80,255,.20),transparent 30%),
    linear-gradient(135deg,#0a1628,#0e1d33);

  border:1px solid rgba(255,255,255,.08);

  box-shadow:
    0 30px 90px rgba(0,0,0,.55),
    inset 0 0 70px rgba(90,110,255,.05);
}

.grid{
  position:absolute;
  inset:0;

  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);

  background-size:45px 45px;
}

.glow{
  position:absolute;
  width:350px;
  height:350px;
  border-radius:50%;
  filter:blur(90px);
  opacity:.35;
}

.glow.one{
  background:#396dff;
  top:-120px;
  left:-80px;
}

.glow.two{
  background:#8d4cff;
  right:-120px;
  bottom:-120px;
}

.shape{
  position:absolute;
  border:2px solid rgba(130,160,255,.5);
  box-shadow:0 0 25px rgba(100,130,255,.35);
  animation:float 7s ease-in-out infinite;
}

.circle{
  width:110px;
  height:110px;
  border-radius:50%;
  right:10%;
  top:12%;
}

.square{
  width:85px;
  height:85px;
  right:24%;
  bottom:13%;
  transform:rotate(25deg);
  animation-delay:1s;
}

.triangle{
  width:0;
  height:0;
  border-left:55px solid transparent;
  border-right:55px solid transparent;
  border-bottom:95px solid rgba(120,150,255,.14);
  right:6%;
  bottom:9%;
  filter:drop-shadow(0 0 20px rgba(100,130,255,.35));
  animation:float 6s ease-in-out infinite;
}

.line1{
  position:absolute;
  width:220px;
  height:2px;
  right:8%;
  top:48%;
  background:linear-gradient(90deg,transparent,#7997ff,transparent);
  transform:rotate(-20deg);
}

.line2{
  position:absolute;
  width:180px;
  height:2px;
  right:14%;
  top:60%;
  background:linear-gradient(90deg,transparent,#9b7cff,transparent);
  transform:rotate(15deg);
}

.math-symbol{
  position:absolute;
  font-weight:900;
  color:rgba(180,200,255,.16);
  text-shadow:0 0 20px rgba(100,130,255,.25);
  user-select:none;
}

.s1{
  font-size:110px;
  right:18%;
  top:20%;
}

.s2{
  font-size:70px;
  right:7%;
  top:55%;
}

.s3{
  font-size:90px;
  right:30%;
  bottom:8%;
}

.content{
  position:relative;
  z-index:5;
  width:60%;
  height:100%;
  padding:7%;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.slide-number{
  font-size:13px;
  color:#8da5ff;
  margin-bottom:18px;
  font-weight:800;
  letter-spacing:1px;
}

h1{
  font-size:clamp(30px,4vw,58px);
  line-height:1.08;
  margin-bottom:28px;
  max-width:700px;
}

ul{
  padding-left:24px;
}

li{
  margin-bottom:16px;
  font-size:clamp(16px,1.6vw,24px);
  line-height:1.45;
  color:#dce5f4;
}

.visual-card{
  position:absolute;
  right:5%;
  top:18%;
  width:30%;
  height:64%;
  border-radius:28px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.06),
      rgba(255,255,255,.015)
    );

  border:1px solid rgba(255,255,255,.11);

  box-shadow:
    inset 0 0 35px rgba(120,140,255,.05),
    0 20px 50px rgba(0,0,0,.3);

  backdrop-filter:blur(10px);
}

.visual-card::before{
  content:"";
  position:absolute;
  inset:18px;
  border-radius:22px;
  border:1px solid rgba(130,160,255,.15);
}

.center-symbol{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:100px;
  font-weight:900;
  color:rgba(170,190,255,.8);
  text-shadow:
    0 0 20px rgba(100,130,255,.7),
    0 0 50px rgba(120,80,255,.3);
}

@keyframes float{
  0%,100%{
    transform:translateY(0) rotate(0deg);
  }

  50%{
    transform:translateY(-14px) rotate(8deg);
  }
}

.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:16px;
  padding:15px 20px 25px;
}

.nav-btn{
  width:44px;
  height:44px;
  border-radius:50%;
  background:#18243a;
  color:white;
  font-size:19px;
}

.dots{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  justify-content:center;
  max-width:500px;
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#3c4b62;
  cursor:pointer;
}

.dot.active{
  background:#7c94ff;
  transform:scale(1.3);
}

#errorBox{
  display:none;
  max-width:700px;
  margin:80px auto;
  padding:30px;
  border-radius:20px;
  background:#101b31;
  text-align:center;
}

#printArea{
  display:none;
}

@media(max-width:800px){

  .slide{
    aspect-ratio:auto;
    min-height:78vh;
  }

  .content{
    width:100%;
    padding:30px;
    padding-bottom:280px;
  }

  .visual-card{
    width:80%;
    height:230px;
    right:10%;
    top:auto;
    bottom:30px;
  }

  h1{
    font-size:32px;
  }

  li{
    font-size:17px;
  }

  .s1,
  .s2,
  .s3,
  .circle,
  .square,
  .triangle,
  .line1,
  .line2{
    display:none;
  }
}

@media print{

  @page{
    size:A4 landscape;
    margin:0;
  }

  body{
    background:white;
  }

  .topbar,
  .viewer,
  .controls,
  #errorBox{
    display:none !important;
  }

  #printArea{
    display:block !important;
  }

  .print-slide{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;

    page-break-after:always;
    break-after:page;

    background:
      radial-gradient(circle at 20% 20%,rgba(70,120,255,.25),transparent 30%),
      radial-gradient(circle at 80% 80%,rgba(150,80,255,.20),transparent 30%),
      linear-gradient(135deg,#0a1628,#0e1d33);

    color:white;
  }

  .print-content{
    width:62%;
    height:100%;
    padding:7%;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }

  .print-content h1{
    font-size:38px;
    margin-bottom:22px;
  }

  .print-content li{
    font-size:20px;
    margin-bottom:12px;
  }

  .print-visual{
    position:absolute;
    right:6%;
    top:20%;
    width:28%;
    height:60%;
    border-radius:26px;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.05);
    display:flex;
    align-items:center;
    justify-content:center;

    font-size:100px;
    font-weight:900;
    color:#b6c5ff;
  }
}

</style>
</head>

<body>

<div class="topbar">

  <div class="logo">
    Math<span>AI</span>
  </div>

  <div class="actions">

    <button
      class="back-btn"
      onclick="location.href='index.html'">
      ← Жаңы түзүү
    </button>

    <button
      class="pdf-btn"
      id="pdfBtn">
      PDF сактоо
    </button>

  </div>

</div>

<div id="errorBox"></div>

<div class="viewer" id="viewer">

  <div class="slide">

    <div class="grid"></div>

    <div class="glow one"></div>
    <div class="glow two"></div>

    <div class="shape circle"></div>
    <div class="shape square"></div>

    <div class="triangle"></div>

    <div class="line1"></div>
    <div class="line2"></div>

    <div class="math-symbol s1">π</div>
    <div class="math-symbol s2">√</div>
    <div class="math-symbol s3">x²</div>

    <div class="content">

      <div
        class="slide-number"
        id="slideNumber">
      </div>

      <h1 id="title"></h1>

      <ul id="points"></ul>

    </div>

    <div class="visual-card">

      <div
        class="center-symbol"
        id="centerSymbol">
        ∑
      </div>

    </div>

  </div>

</div>

<div class="controls">

  <button
    class="nav-btn"
    id="prevBtn">
    ←
  </button>

  <div
    class="dots"
    id="dots">
  </div>

  <button
    class="nav-btn"
    id="nextBtn">
    →
  </button>

</div>

<div id="printArea"></div>

<script>

let slides=[];
let currentIndex=0;

const symbols=[
  "∑",
  "π",
  "√",
  "∞",
  "x²",
  "Δ",
  "∫",
  "%",
  "÷",
  "×"
];

const title=
document.getElementById("title");

const points=
document.getElementById("points");

const slideNumber=
document.getElementById("slideNumber");

const dots=
document.getElementById("dots");

const centerSymbol=
document.getElementById("centerSymbol");

const viewer=
document.getElementById("viewer");

const errorBox=
document.getElementById("errorBox");


function showError(message){

  viewer.style.display="none";

  errorBox.style.display="block";

  errorBox.innerHTML=`
    <h2>Презентация ачылган жок</h2>
    <br>
    <p>${message}</p>
    <br>
    <button
      class="back-btn"
      onclick="location.href='index.html'">
      Башкы бетке кайтуу
    </button>
  `;
}


function loadPresentation(){

  try{

    const raw=
    localStorage.getItem(
      "math_ai_presentation"
    );

    if(!raw){

      showError(
        "Презентация маалыматы табылган жок."
      );

      return false;
    }

    const saved=
    JSON.parse(raw);

    const presentation=
    saved?.presentation
    ? saved.presentation
    : saved;

    if(
      !presentation ||
      !Array.isArray(presentation.slides) ||
      !presentation.slides.length
    ){

      showError(
        "Слайддар табылган жок."
      );

      return false;
    }

    slides=
    presentation.slides;

    return true;

  }catch(error){

    console.error(error);

    showError(
      "Презентацияны окууда ката кетти."
    );

    return false;
  }
}


function renderSlide(){

  if(!slides.length){
    return;
  }

  const slide=
  slides[currentIndex];

  slideNumber.textContent=
  `СЛАЙД ${currentIndex+1} / ${slides.length}`;

  title.textContent=
  slide.title || "Математика";

  points.innerHTML="";

  const list=
  Array.isArray(slide.points)
  ? slide.points
  : [];

  list.forEach(point=>{

    const li=
    document.createElement("li");

    li.textContent=point;

    points.appendChild(li);
  });

  centerSymbol.textContent=
  symbols[
    currentIndex %
    symbols.length
  ];

  renderDots();
}


function renderDots(){

  dots.innerHTML="";

  slides.forEach(
    (_,index)=>{

      const dot=
      document.createElement("div");

      dot.className=
      index===currentIndex
      ? "dot active"
      : "dot";

      dot.onclick=()=>{

        currentIndex=index;

        renderSlide();
      };

      dots.appendChild(dot);
    }
  );
}


document.getElementById(
  "prevBtn"
).onclick=()=>{

  if(currentIndex>0){

    currentIndex--;

    renderSlide();
  }
};


document.getElementById(
  "nextBtn"
).onclick=()=>{

  if(
    currentIndex<
    slides.length-1
  ){

    currentIndex++;

    renderSlide();
  }
};


document.addEventListener(
  "keydown",
  e=>{

    if(
      e.key==="ArrowRight" &&
      currentIndex<slides.length-1
    ){

      currentIndex++;

      renderSlide();
    }

    if(
      e.key==="ArrowLeft" &&
      currentIndex>0
    ){

      currentIndex--;

      renderSlide();
    }
  }
);


function createPrintSlides(){

  const area=
  document.getElementById(
    "printArea"
  );

  area.innerHTML="";

  slides.forEach(
    (slide,index)=>{

      const page=
      document.createElement(
        "div"
      );

      page.className=
      "print-slide";


      const content=
      document.createElement(
        "div"
      );

      content.className=
      "print-content";


      const h1=
      document.createElement(
        "h1"
      );

      h1.textContent=
      slide.title || "";


      const ul=
      document.createElement(
        "ul"
      );


      (
        Array.isArray(slide.points)
        ? slide.points
        : []
      ).forEach(point=>{

        const li=
        document.createElement(
          "li"
        );

        li.textContent=
        point;

        ul.appendChild(li);
      });


      content.appendChild(h1);

      content.appendChild(ul);


      const visual=
      document.createElement(
        "div"
      );

      visual.className=
      "print-visual";

      visual.textContent=
      symbols[
        index %
        symbols.length
      ];


      page.appendChild(
        content
      );

      page.appendChild(
        visual
      );

      area.appendChild(
        page
      );
    }
  );
}


document.getElementById(
  "pdfBtn"
).onclick=()=>{

  createPrintSlides();

  setTimeout(()=>{

    window.print();

  },300);
};


if(loadPresentation()){

  renderSlide();
}

</script>

</body>
</html>
