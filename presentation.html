<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Math AI Presentation</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#07111f;
  color:white;
  min-height:100vh;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 22px;
}

.logo{
  font-size:22px;
  font-weight:900;
}

.logo span{
  color:#819cff;
}

.actions{
  display:flex;
  gap:10px;
}

button{
  border:none;
  border-radius:12px;
  padding:11px 16px;
  cursor:pointer;
  font-weight:700;
}

.back-btn{
  background:#18243a;
  color:white;
}

.pdf-btn{
  background:linear-gradient(90deg,#5f7cff,#8d62ff);
  color:white;
}

.viewer{
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.slide{
  width:min(1200px,94vw);
  aspect-ratio:16/9;

  background:
    radial-gradient(circle at top left,rgba(100,130,255,.18),transparent 35%),
    linear-gradient(135deg,#0c1729,#101b31);

  border:1px solid rgba(255,255,255,.1);
  border-radius:24px;
  overflow:hidden;

  display:grid;
  grid-template-columns:1.05fr .95fr;

  box-shadow:0 30px 90px rgba(0,0,0,.45);
}

.text-side{
  padding:7%;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.slide-number{
  color:#8da5ff;
  font-size:13px;
  font-weight:800;
  margin-bottom:18px;
}

h1{
  font-size:clamp(28px,3.2vw,54px);
  margin-bottom:25px;
}

ul{
  padding-left:22px;
}

li{
  margin-bottom:15px;
  font-size:clamp(15px,1.5vw,23px);
  line-height:1.45;
  color:#d9e1ef;
}

.image-side{
  padding:4%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.image-box{
  width:100%;
  height:82%;
  border-radius:22px;
  overflow:hidden;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);

  color:#9fb0c7;
}

.image-box img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:16px;
  padding:15px 20px 25px;
}

.nav-btn{
  width:44px;
  height:44px;
  border-radius:50%;
  background:#18243a;
  color:white;
  font-size:19px;
}

.dots{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#3c4b62;
}

.dot.active{
  background:#7c94ff;
}

.error{
  max-width:700px;
  margin:80px auto;
  padding:30px;
  text-align:center;
  background:#101b31;
  border-radius:20px;
}

#printArea{
  display:none;
}

@media(max-width:800px){
  .slide{
    grid-template-columns:1fr;
    aspect-ratio:auto;
  }

  .image-box{
    min-height:260px;
  }
}

@media print{
  @page{
    size:landscape;
    margin:0;
  }

  .topbar,
  .viewer,
  .controls{
    display:none !important;
  }

  #printArea{
    display:block !important;
  }

  .print-slide{
    width:100vw;
    height:100vh;
    page-break-after:always;

    display:grid;
    grid-template-columns:1.05fr .95fr;

    background:#0c1729;
    color:white;
  }

  .print-text{
    padding:7%;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }

  .print-image{
    padding:5%;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .print-image img{
    width:100%;
    height:75%;
    object-fit:cover;
    border-radius:18px;
  }
}
</style>
</head>

<body>

<div class="topbar">

  <div class="logo">
    Math<span>AI</span>
  </div>

  <div class="actions">

    <button
      class="back-btn"
      onclick="location.href='index.html'">
      ← Жаңы түзүү
    </button>

    <button
      class="pdf-btn"
      id="pdfBtn">
      PDF сактоо
    </button>

  </div>

</div>

<div id="main">

  <div class="viewer">

    <div class="slide">

      <div class="text-side">

        <div
          class="slide-number"
          id="slideNumber">
        </div>

        <h1 id="title"></h1>

        <ul id="points"></ul>

      </div>

      <div class="image-side">

        <div
          class="image-box"
          id="imageBox">

          Сүрөт жүктөлүүдө...

        </div>

      </div>

    </div>

  </div>

  <div class="controls">

    <button
      class="nav-btn"
      id="prevBtn">
      ←
    </button>

    <div
      class="dots"
      id="dots">
    </div>

    <button
      class="nav-btn"
      id="nextBtn">
      →
    </button>

  </div>

</div>

<div id="printArea"></div>

<script>

let slides = [];
let currentIndex = 0;

const main =
  document.getElementById("main");

const title =
  document.getElementById("title");

const points =
  document.getElementById("points");

const slideNumber =
  document.getElementById("slideNumber");

const imageBox =
  document.getElementById("imageBox");

const dots =
  document.getElementById("dots");


function showError(message){

  main.innerHTML = `
    <div class="error">
      <h2>Презентация ачылган жок</h2>
      <br>
      <p>${message}</p>
      <br>
      <button
        class="back-btn"
        onclick="location.href='index.html'">
        Башкы бетке кайтуу
      </button>
    </div>
  `;
}


function loadPresentation(){

  try{

    const raw =
      localStorage.getItem(
        "math_ai_presentation"
      );

    if(!raw){

      showError(
        "Презентация маалыматы табылган жок. Жаңы презентация түзүңүз."
      );

      return false;
    }


    const saved =
      JSON.parse(raw);


    const presentation =
      saved?.presentation
      ? saved.presentation
      : saved;


    if(
      !presentation ||
      !Array.isArray(presentation.slides) ||
      presentation.slides.length === 0
    ){

      console.log(saved);

      showError(
        "Слайддардын маалыматы туура эмес."
      );

      return false;
    }


    slides =
      presentation.slides;


    return true;

  }catch(error){

    console.error(
      "Presentation load error:",
      error
    );

    showError(
      "Презентация маалыматын окууда ката кетти."
    );

    return false;
  }

}


function getCachedImage(index){

  try{

    return sessionStorage.getItem(
      `math_ai_image_${index}`
    );

  }catch(error){

    return null;

  }

}


async function generateImage(index){

  const slide =
    slides[index];

  if(!slide?.imagePrompt){
    return null;
  }


  try{

    const response =
      await fetch(
        "/api/image",
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json"
          },

          body:JSON.stringify({
            prompt:slide.imagePrompt
          })
        }
      );


    const data =
      await response.json();


    if(
      response.ok &&
      data.success &&
      data.image
    ){

      try{

        sessionStorage.setItem(
          `math_ai_image_${index}`,
          data.image
        );

      }catch(error){

        console.warn(
          "Сүрөт cache'ге сакталган жок"
        );

      }


      return data.image;

    }


    console.error(
      "Image API:",
      data
    );


  }catch(error){

    console.error(
      "Image generation:",
      error
    );

  }


  return null;

}


async function renderSlide(){

  if(!slides.length){
    return;
  }


  const slide =
    slides[currentIndex];


  slideNumber.textContent =
    `СЛАЙД ${currentIndex + 1} / ${slides.length}`;


  title.textContent =
    slide.title || "Аталышы жок";


  points.innerHTML = "";


  const list =
    Array.isArray(slide.points)
    ? slide.points
    : [];


  list.forEach(point=>{

    const li =
      document.createElement("li");

    li.textContent =
      point;

    points.appendChild(li);

  });


  imageBox.textContent =
    "Сүрөт жүктөлүүдө...";


  let image =
    getCachedImage(
      currentIndex
    );


  if(!image){

    image =
      await generateImage(
        currentIndex
      );

  }


  if(image){

    imageBox.innerHTML = "";

    const img =
      document.createElement("img");

    img.src = image;

    imageBox.appendChild(img);

  }else{

    imageBox.textContent =
      "Сүрөт жок";

  }


  renderDots();

}


function renderDots(){

  dots.innerHTML = "";


  slides.forEach(
    (_,index)=>{

      const dot =
        document.createElement("div");

      dot.className =
        index === currentIndex
        ? "dot active"
        : "dot";


      dot.onclick = ()=>{

        currentIndex =
          index;

        renderSlide();

      };


      dots.appendChild(dot);

    }
  );

}


document.getElementById(
  "prevBtn"
).onclick = ()=>{

  if(currentIndex > 0){

    currentIndex--;

    renderSlide();

  }

};


document.getElementById(
  "nextBtn"
).onclick = ()=>{

  if(
    currentIndex <
    slides.length - 1
  ){

    currentIndex++;

    renderSlide();

  }

};


async function ensureImages(){

  for(
    let i = 0;
    i < slides.length;
    i++
  ){

    if(
      !getCachedImage(i)
    ){

      await generateImage(i);

    }

  }

}


function createPrintSlides(){

  const area =
    document.getElementById(
      "printArea"
    );

  area.innerHTML = "";


  slides.forEach(
    (slide,index)=>{

      const page =
        document.createElement(
          "div"
        );

      page.className =
        "print-slide";


      const text =
        document.createElement(
          "div"
        );

      text.className =
        "print-text";


      const heading =
        document.createElement(
          "h1"
        );

      heading.textContent =
        slide.title || "";


      const ul =
        document.createElement(
          "ul"
        );


      (
        Array.isArray(slide.points)
        ? slide.points
        : []
      ).forEach(point=>{

        const li =
          document.createElement(
            "li"
          );

        li.textContent =
          point;

        ul.appendChild(li);

      });


      text.appendChild(
        heading
      );

      text.appendChild(
        ul
      );


      const imageSide =
        document.createElement(
          "div"
        );

      imageSide.className =
        "print-image";


      const cached =
        getCachedImage(
          index
        );


      if(cached){

        const img =
          document.createElement(
            "img"
          );

        img.src =
          cached;

        imageSide.appendChild(
          img
        );

      }


      page.appendChild(
        text
      );

      page.appendChild(
        imageSide
      );

      area.appendChild(
        page
      );

    }
  );

}


document.getElementById(
  "pdfBtn"
).onclick =
async ()=>{

  const btn =
    document.getElementById(
      "pdfBtn"
    );

  btn.disabled =
    true;

  btn.textContent =
    "PDF даярдалууда...";


  await ensureImages();

  createPrintSlides();


  setTimeout(()=>{

    window.print();

    btn.disabled =
      false;

    btn.textContent =
      "PDF сактоо";

  },500);

};


if(loadPresentation()){

  renderSlide();

}

</script>

</body>
</html>
