<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math AI — Презентация</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #050b14;
      color: white;
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(5, 11, 20, 0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .topbar-inner {
      width: min(1250px, 94%);
      min-height: 72px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      font-size: 24px;
      font-weight: 900;
    }

    .logo span {
      color: #7c9cff;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button,
    .link-btn {
      border: none;
      border-radius: 12px;
      padding: 11px 15px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
    }

    .secondary {
      background: rgba(255,255,255,0.08);
      color: white;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .primary {
      background: linear-gradient(90deg, #5f7cff, #8d62ff);
      color: white;
    }

    .page {
      width: min(1250px, 94%);
      margin: auto;
      padding: 35px 0 80px;
    }

    .page-head {
      text-align: center;
      margin-bottom: 28px;
    }

    .page-head h1 {
      font-size: clamp(28px, 5vw, 48px);
      margin-bottom: 10px;
    }

    .page-head p {
      color: #91a1b8;
    }

    .presentation-info {
      margin-top: 16px;
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill {
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(124,156,255,0.12);
      border: 1px solid rgba(124,156,255,0.2);
      font-size: 13px;
    }

    .viewer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .slide-wrapper {
      width: min(1150px, 100%);
    }

    .slide {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 28px;
      overflow: hidden;
      position: relative;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      background:
        radial-gradient(circle at 10% 20%, rgba(77,124,255,0.45), transparent 30%),
        radial-gradient(circle at 70% 90%, rgba(142,74,255,0.25), transparent 40%),
        linear-gradient(135deg, #08111f, #0d1a30);
      box-shadow: 0 30px 100px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .text-side {
      padding: clamp(28px, 5vw, 65px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      z-index: 2;
    }

    .slide-number {
      display: inline-block;
      width: max-content;
      padding: 8px 13px;
      border-radius: 999px;
      margin-bottom: 18px;
      background: rgba(255,255,255,0.1);
      font-size: 13px;
      color: #dce6ff;
    }

    .slide h2 {
      font-size: clamp(26px, 4.4vw, 50px);
      line-height: 1.08;
      margin-bottom: 24px;
    }

    .slide ul {
      padding-left: 24px;
      display: grid;
      gap: 10px;
    }

    .slide li,
    .slide p {
      font-size: clamp(15px, 1.8vw, 21px);
      line-height: 1.55;
      color: #d4deed;
    }

    .image-side {
      position: relative;
      min-width: 0;
      overflow: hidden;
      background: rgba(255,255,255,0.03);
    }

    .image-side img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .image-side::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        rgba(8,17,31,0.9) 0%,
        rgba(8,17,31,0.18) 28%,
        rgba(8,17,31,0) 55%
      );
      pointer-events: none;
    }

    .image-loading {
      width: 100%;
      height: 100%;
      min-height: 320px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 30px;
      color: #b6c4d8;
      background:
        radial-gradient(circle at 50% 50%, rgba(124,156,255,0.18), transparent 40%),
        #0b1627;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.12);
      border-top-color: #7c9cff;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 14px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .nav-btn {
      min-width: 120px;
      padding: 13px 18px;
      border-radius: 14px;
      background: rgba(255,255,255,0.08);
      color: white;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .counter {
      min-width: 95px;
      text-align: center;
      color: #a8b7cc;
      font-size: 14px;
    }

    .dots {
      margin-top: 8px;
      display: flex;
      gap: 7px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      cursor: pointer;
    }

    .dot.active {
      background: #7c9cff;
      transform: scale(1.25);
    }

    .empty {
      text-align: center;
      padding: 80px 20px;
      color: #93a1b5;
    }

    @media (max-width: 750px) {
      .topbar-inner {
        padding: 12px 0;
        flex-direction: column;
        align-items: flex-start;
      }

      .slide {
        aspect-ratio: auto;
        grid-template-columns: 1fr;
      }

      .image-side {
        min-height: 300px;
      }

      .image-side::after {
        background: linear-gradient(
          180deg,
          rgba(8,17,31,0.35),
          rgba(8,17,31,0)
        );
      }
    }

    @page {
      size: landscape;
      margin: 0;
    }

    @media print {
      body {
        background: white;
      }

      .topbar,
      .page-head,
      .controls,
      .dots {
        display: none !important;
      }

      .page {
        width: 100%;
        padding: 0;
        margin: 0;
      }

      .viewer {
        display: block;
      }

      .slide-wrapper {
        width: 100%;
        page-break-after: always;
        break-after: page;
      }

      .slide {
        width: 100vw;
        height: 100vh;
        aspect-ratio: auto;
        border-radius: 0;
        box-shadow: none;
        border: none;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">
    <div class="topbar-inner">

      <div class="logo">
        Math<span>AI</span>
      </div>

      <div class="actions">

        <a href="index.html" class="link-btn secondary">
          ← Жаңы презентация
        </a>

        <button class="primary" id="pdfBtn">
          PDF жүктөө
        </button>

      </div>

    </div>
  </div>

  <main class="page">

    <div class="page-head">

      <h1 id="presentationTitle">
        Презентация
      </h1>

      <p>
        AI түзгөн визуалдуу математика слайддары
      </p>

      <div
        class="presentation-info"
        id="presentationInfo">
      </div>

    </div>

    <div id="viewer" class="viewer"></div>

  </main>

  <script>
    const viewer = document.getElementById("viewer");
    const titleBox = document.getElementById("presentationTitle");
    const infoBox = document.getElementById("presentationInfo");
    const pdfBtn = document.getElementById("pdfBtn");

    let slides = [];
    let currentSlide = 0;
    let presentationData = {};

    function escapeHTML(text) {
      return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function getCachedImage(index) {
      return sessionStorage.getItem(
        `math_ai_image_${index}`
      );
    }

    function setCachedImage(index, image) {
      try {
        sessionStorage.setItem(
          `math_ai_image_${index}`,
          image
        );
      } catch (error) {
        console.log("Image cache full");
      }
    }

    async function generateImage(index) {

      const slide = slides[index];

      if (!slide || !slide.imagePrompt) {
        return;
      }

      const cached = getCachedImage(index);

      if (cached) {
        return;
      }

      try {

        const response = await fetch("/api/image", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            prompt: slide.imagePrompt
          })
        });

        const data = await response.json();

        if (
          response.ok &&
          data.success &&
          data.image
        ) {

          setCachedImage(index, data.image);

          if (currentSlide === index) {
            renderSlide(false);
          }
        }

      } catch (error) {
        console.error(
          "Image generation failed:",
          error
        );
      }
    }

    function loadPresentation() {

      const saved =
        localStorage.getItem(
          "math_ai_presentation"
        );

      if (!saved) {

        viewer.innerHTML = `
          <div class="empty">
            <h2>Презентация табылган жок</h2>
            <p>
              Башкы бетке кайтып,
              жаңы презентация түзүңүз.
            </p>
          </div>
        `;

        return;
      }

      try {

        const data = JSON.parse(saved);

        presentationData =
          data.presentation || data;

        slides =
          presentationData.slides || [];

        titleBox.textContent =
          presentationData.topic ||
          "Математика презентациясы";

        infoBox.innerHTML = `
          ${
            presentationData.grade
              ? `<span class="pill">${escapeHTML(presentationData.grade)}</span>`
              : ""
          }

          ${
            presentationData.language
              ? `<span class="pill">${escapeHTML(presentationData.language)}</span>`
              : ""
          }

          ${
            presentationData.style
              ? `<span class="pill">${escapeHTML(presentationData.style)}</span>`
              : ""
          }

          <span class="pill">
            ${slides.length} слайд
          </span>
        `;

        renderSlide(true);

      } catch (error) {

        viewer.innerHTML = `
          <div class="empty">
            Маалымат ачылган жок.
          </div>
        `;
      }
    }

    function createContent(slide) {

      if (Array.isArray(slide.points)) {

        return `
          <ul>
            ${slide.points.map(point =>
              `<li>${escapeHTML(point)}</li>`
            ).join("")}
          </ul>
        `;
      }

      if (Array.isArray(slide.content)) {

        return `
          <ul>
            ${slide.content.map(point =>
              `<li>${escapeHTML(point)}</li>`
            ).join("")}
          </ul>
        `;
      }

      return `
        <p>
          ${escapeHTML(
            slide.content ||
            slide.text ||
            slide.description ||
            ""
          )}
        </p>
      `;
    }

    function renderSlide(shouldGenerate = true) {

      if (!slides.length) {

        viewer.innerHTML = `
          <div class="empty">
            Слайддар табылган жок.
          </div>
        `;

        return;
      }

      const slide =
        slides[currentSlide];

      const image =
        getCachedImage(currentSlide);

      const dots =
        slides.map((_, index) => `
          <span
            class="dot ${
              index === currentSlide
                ? "active"
                : ""
            }"
            onclick="goToSlide(${index})">
          </span>
        `).join("");

      let imageHTML;

      if (image) {

        imageHTML = `
          <img
            src="${image}"
            alt="AI slide illustration"
          >
        `;

      } else {

        imageHTML = `
          <div class="image-loading">
            <div>
              <div class="spinner"></div>
              AI сүрөт даярдап жатат...
            </div>
          </div>
        `;
      }

      viewer.innerHTML = `

        <div class="slide-wrapper">

          <div class="slide">

            <div class="text-side">

              <div class="slide-number">
                Слайд ${currentSlide + 1}
              </div>

              <h2>
                ${escapeHTML(
                  slide.title ||
                  `Слайд ${currentSlide + 1}`
                )}
              </h2>

              ${createContent(slide)}

            </div>

            <div class="image-side">
              ${imageHTML}
            </div>

          </div>

        </div>

        <div class="controls">

          <button
            class="nav-btn"
            onclick="prevSlide()">
            ← Артка
          </button>

          <div class="counter">
            ${currentSlide + 1}
            /
            ${slides.length}
          </div>

          <button
            class="nav-btn"
            onclick="nextSlide()">
            Кийинки →
          </button>

        </div>

        <div class="dots">
          ${dots}
        </div>
      `;

      if (
        shouldGenerate &&
        !image &&
        slide.imagePrompt
      ) {
        generateImage(currentSlide);
      }

      const nextIndex =
        currentSlide + 1;

      if (
        nextIndex < slides.length &&
        !getCachedImage(nextIndex) &&
        slides[nextIndex]?.imagePrompt
      ) {
        setTimeout(() => {
          generateImage(nextIndex);
        }, 1000);
      }
    }

    function nextSlide() {

      if (
        currentSlide <
        slides.length - 1
      ) {

        currentSlide++;

      } else {

        currentSlide = 0;
      }

      renderSlide(true);
    }

    function prevSlide() {

      if (currentSlide > 0) {

        currentSlide--;

      } else {

        currentSlide =
          slides.length - 1;
      }

      renderSlide(true);
    }

    function goToSlide(index) {

      currentSlide = index;

      renderSlide(true);
    }

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "ArrowRight"
        ) {
          nextSlide();
        }

        if (
          event.key ===
          "ArrowLeft"
        ) {
          prevSlide();
        }
      }
    );

    async function prepareAllImages() {

      for (
        let i = 0;
        i < slides.length;
        i++
      ) {

        if (
          !getCachedImage(i) &&
          slides[i]?.imagePrompt
        ) {
          await generateImage(i);
        }
      }
    }

    pdfBtn.addEventListener(
      "click",
      async () => {

        const oldText =
          pdfBtn.textContent;

        pdfBtn.disabled = true;

        pdfBtn.textContent =
          "Сүрөттөр даярдалып жатат...";

        await prepareAllImages();

        pdfBtn.textContent =
          "PDF даярдалууда...";

        const originalSlide =
          currentSlide;

        viewer.innerHTML =
          slides.map(
            (slide, index) => {

              const image =
                getCachedImage(index);

              return `
                <div class="slide-wrapper">

                  <div class="slide">

                    <div class="text-side">

                      <div class="slide-number">
                        Слайд ${index + 1}
                      </div>

                      <h2>
                        ${escapeHTML(
                          slide.title ||
                          `Слайд ${index + 1}`
                        )}
                      </h2>

                      ${createContent(slide)}

                    </div>

                    <div class="image-side">

                      ${
                        image
                          ? `
                            <img
                              src="${image}"
                              alt="AI image"
                            >
                          `
                          : `
                            <div class="image-loading">
                              Сүрөт жок
                            </div>
                          `
                      }

                    </div>

                  </div>

                </div>
              `;
            }
          ).join("");

        setTimeout(() => {

          window.print();

          setTimeout(() => {

            currentSlide =
              originalSlide;

            renderSlide(false);

            pdfBtn.disabled =
              false;

            pdfBtn.textContent =
              oldText;

          }, 700);

        }, 500);
      }
    );

    loadPresentation();
  </script>

</body>
</html>
