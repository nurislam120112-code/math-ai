<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>School AI Presentation</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#050b16;
  color:white;
  min-height:100vh;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:16px 22px;
}

.logo{
  font-size:24px;
  font-weight:900;
}

.logo span{
  background:linear-gradient(90deg,#6f95ff,#a66cff,#55e5ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.actions{
  display:flex;
  gap:10px;
}

button{
  border:0;
  border-radius:12px;
  padding:11px 16px;
  font-weight:700;
  cursor:pointer;
}

.back-btn{
  background:#162239;
  color:white;
}

.pdf-btn{
  color:white;
  background:linear-gradient(90deg,#5f7cff,#8e5fff,#43c9ef);
}

.viewer{
  display:flex;
  justify-content:center;
  padding:20px;
}

.slide{
  width:min(1200px,94vw);
  aspect-ratio:16/9;
  border-radius:30px;
  position:relative;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 30px 100px rgba(0,0,0,.55);
}

.slide.variant-0{
  background:
    radial-gradient(circle at 15% 20%,rgba(54,108,255,.34),transparent 30%),
    radial-gradient(circle at 85% 75%,rgba(146,55,255,.28),transparent 30%),
    linear-gradient(135deg,#071427,#0d1e36);
}

.slide.variant-1{
  background:
    radial-gradient(circle at 75% 15%,rgba(0,218,255,.30),transparent 28%),
    radial-gradient(circle at 20% 80%,rgba(40,82,255,.25),transparent 32%),
    linear-gradient(135deg,#061523,#09283a);
}

.slide.variant-2{
  background:
    radial-gradient(circle at 50% 0%,rgba(178,74,255,.35),transparent 30%),
    radial-gradient(circle at 100% 80%,rgba(255,84,147,.20),transparent 34%),
    linear-gradient(135deg,#140b27,#21103c);
}

.slide.variant-3{
  background:
    radial-gradient(circle at 10% 85%,rgba(0,255,184,.22),transparent 28%),
    radial-gradient(circle at 92% 20%,rgba(57,117,255,.30),transparent 28%),
    linear-gradient(135deg,#061a1e,#0c2030);
}

.slide.variant-4{
  background:
    radial-gradient(circle at 30% 20%,rgba(255,165,45,.25),transparent 26%),
    radial-gradient(circle at 80% 75%,rgba(255,76,133,.18),transparent 28%),
    linear-gradient(135deg,#21120c,#281426);
}

.grid{
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:42px 42px;
}

.glow{
  position:absolute;
  border-radius:50%;
  filter:blur(85px);
  opacity:.35;
}

.glow.a{
  width:280px;
  height:280px;
  left:-70px;
  top:-70px;
  background:#557dff;
}

.glow.b{
  width:330px;
  height:330px;
  right:-100px;
  bottom:-100px;
  background:#8e4dff;
}

.glow.c{
  width:190px;
  height:190px;
  right:26%;
  top:10%;
  background:#37d5ff;
  opacity:.18;
}

.content{
  position:relative;
  z-index:5;
  width:62%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:7%;
}

.subject{
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:2px;
  color:#91a8ff;
  font-weight:800;
  margin-bottom:12px;
}

.slide-number{
  color:#8da0b9;
  font-size:13px;
  margin-bottom:14px;
}

h1{
  font-size:clamp(32px,4vw,58px);
  line-height:1.08;
  margin-bottom:26px;
  max-width:720px;
}

ul{
  padding-left:24px;
}

li{
  font-size:clamp(16px,1.65vw,24px);
  line-height:1.45;
  margin-bottom:14px;
  color:#dce6f4;
}

.visual{
  position:absolute;
  z-index:4;
  right:5%;
  top:16%;
  width:31%;
  height:68%;
  border-radius:30px;
  border:1px solid rgba(255,255,255,.13);
  background:
    linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.015));
  backdrop-filter:blur(14px);
  box-shadow:
    inset 0 0 40px rgba(255,255,255,.025),
    0 20px 60px rgba(0,0,0,.35);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.visual::before{
  content:"";
  position:absolute;
  inset:18px;
  border-radius:24px;
  border:1px solid rgba(255,255,255,.09);
}

.main-symbol{
  position:relative;
  z-index:3;
  font-size:clamp(80px,10vw,150px);
  font-weight:900;
  text-align:center;
  filter:drop-shadow(0 0 25px rgba(120,160,255,.45));
}

.ring{
  position:absolute;
  border:2px solid rgba(150,180,255,.22);
  border-radius:50%;
}

.ring.r1{
  width:210px;
  height:210px;
  animation:spin 12s linear infinite;
}

.ring.r2{
  width:145px;
  height:145px;
  border-style:dashed;
  animation:spinReverse 8s linear infinite;
}

.orb{
  position:absolute;
  width:16px;
  height:16px;
  border-radius:50%;
  background:#a8bbff;
  box-shadow:0 0 25px #7594ff;
}

.orb.o1{
  top:16%;
  left:16%;
}

.orb.o2{
  right:13%;
  bottom:17%;
}

.decor{
  position:absolute;
  border:2px solid rgba(130,160,255,.2);
  box-shadow:0 0 30px rgba(100,130,255,.15);
}

.decor.square{
  width:80px;
  height:80px;
  right:34%;
  bottom:8%;
  transform:rotate(25deg);
}

.decor.circle{
  width:100px;
  height:100px;
  border-radius:50%;
  top:8%;
  right:10%;
}

.decor.line{
  width:210px;
  height:2px;
  border:0;
  background:linear-gradient(90deg,transparent,#78a0ff,transparent);
  right:3%;
  top:52%;
  transform:rotate(-24deg);
}

.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:16px;
  padding:14px 20px 26px;
}

.nav-btn{
  width:46px;
  height:46px;
  border-radius:50%;
  color:white;
  background:#152239;
  font-size:19px;
}

.dots{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:7px;
  max-width:550px;
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#36475e;
  cursor:pointer;
}

.dot.active{
  transform:scale(1.3);
  background:#7995ff;
}

#errorBox{
  display:none;
  max-width:700px;
  margin:80px auto;
  padding:30px;
  border-radius:20px;
  text-align:center;
  background:#101b31;
}

#printArea{
  display:none;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

@keyframes spinReverse{
  to{transform:rotate(-360deg);}
}

@media(max-width:800px){
  .topbar{
    flex-direction:column;
    align-items:stretch;
  }

  .actions{
    width:100%;
  }

  .actions button{
    flex:1;
  }

  .slide{
    aspect-ratio:auto;
    min-height:80vh;
  }

  .content{
    width:100%;
    padding:28px;
    padding-bottom:270px;
  }

  .visual{
    width:82%;
    height:220px;
    right:9%;
    top:auto;
    bottom:25px;
  }

  .main-symbol{
    font-size:90px;
  }

  .decor{
    display:none;
  }
}

@media print{
  @page{
    size:A4 landscape;
    margin:0;
  }

  body{
    background:white;
  }

  .topbar,
  .viewer,
  .controls,
  #errorBox{
    display:none !important;
  }

  #printArea{
    display:block !important;
  }

  .print-slide{
    width:297mm;
    height:210mm;
    position:relative;
    overflow:hidden;
    page-break-after:always;
    break-after:page;
    color:white;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }

  .print-slide:last-child{
    page-break-after:auto;
  }

  .print-slide.v0{
    background:
      radial-gradient(circle at 15% 20%,rgba(54,108,255,.34),transparent 30%),
      radial-gradient(circle at 85% 75%,rgba(146,55,255,.28),transparent 30%),
      linear-gradient(135deg,#071427,#0d1e36);
  }

  .print-slide.v1{
    background:
      radial-gradient(circle at 75% 15%,rgba(0,218,255,.30),transparent 28%),
      radial-gradient(circle at 20% 80%,rgba(40,82,255,.25),transparent 32%),
      linear-gradient(135deg,#061523,#09283a);
  }

  .print-slide.v2{
    background:
      radial-gradient(circle at 50% 0%,rgba(178,74,255,.35),transparent 30%),
      radial-gradient(circle at 100% 80%,rgba(255,84,147,.20),transparent 34%),
      linear-gradient(135deg,#140b27,#21103c);
  }

  .print-slide.v3{
    background:
      radial-gradient(circle at 10% 85%,rgba(0,255,184,.22),transparent 28%),
      radial-gradient(circle at 92% 20%,rgba(57,117,255,.30),transparent 28%),
      linear-gradient(135deg,#061a1e,#0c2030);
  }

  .print-slide.v4{
    background:
      radial-gradient(circle at 30% 20%,rgba(255,165,45,.25),transparent 26%),
      radial-gradient(circle at 80% 75%,rgba(255,76,133,.18),transparent 28%),
      linear-gradient(135deg,#21120c,#281426);
  }

  .print-content{
    width:62%;
    height:100%;
    padding:20mm;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }

  .print-subject{
    color:#9eb3ff;
    font-size:12px;
    font-weight:bold;
    margin-bottom:10px;
  }

  .print-number{
    color:#9aa9bc;
    font-size:12px;
    margin-bottom:10px;
  }

  .print-content h1{
    font-size:34px;
    margin-bottom:20px;
  }

  .print-content li{
    font-size:18px;
    line-height:1.4;
    margin-bottom:10px;
  }

  .print-visual{
    position:absolute;
    right:18mm;
    top:40mm;
    width:80mm;
    height:130mm;
    border-radius:25px;
    border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.05);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:90px;
    font-weight:900;
  }
}
</style>
</head>

<body>

<div class="topbar">

  <div class="logo">
    School<span>AI</span>
  </div>

  <div class="actions">

    <button
      class="back-btn"
      onclick="location.href='index.html'">
      ← Жаңы түзүү
    </button>

    <button
      class="pdf-btn"
      id="pdfBtn">
      PDF сактоо
    </button>

  </div>

</div>

<div id="errorBox"></div>

<div class="viewer" id="viewer">

  <div class="slide variant-0" id="slide">

    <div class="grid"></div>

    <div class="glow a"></div>
    <div class="glow b"></div>
    <div class="glow c"></div>

    <div class="decor square"></div>
    <div class="decor circle"></div>
    <div class="decor line"></div>

    <div class="content">

      <div class="subject" id="subjectLabel"></div>

      <div
        class="slide-number"
        id="slideNumber">
      </div>

      <h1 id="title"></h1>

      <ul id="points"></ul>

    </div>

    <div class="visual">

      <div class="ring r1"></div>
      <div class="ring r2"></div>

      <div class="orb o1"></div>
      <div class="orb o2"></div>

      <div
        class="main-symbol"
        id="mainSymbol">
      </div>

    </div>

  </div>

</div>

<div class="controls">

  <button
    class="nav-btn"
    id="prevBtn">
    ←
  </button>

  <div
    class="dots"
    id="dots">
  </div>

  <button
    class="nav-btn"
    id="nextBtn">
    →
  </button>

</div>

<div id="printArea"></div>

<script>

let slides = [];
let currentIndex = 0;
let subject = "Мектеп сабагы";

const subjectSymbols = {

  "Математика":["∑","π","√","∞","x²","Δ"],
  "Алгебра":["x²","y=","√","±","∞","∑"],
  "Геометрия":["△","○","□","∠","π","◇"],

  "Физика":["⚡","F","E","λ","Ω","→"],

  "Химия":["⚗","H₂O","CO₂","O₂","Na","🧪"],

  "Биология":["DNA","🧬","🌿","🫀","🧠","🦠"],

  "География":["🌍","🧭","⛰","🌊","☀","🗺"],

  "Тарых":["📜","🏛","⚔","👑","⌛","📚"],

  "Кыргыз тили":["А","Б","СӨЗ","✎","📖","Ү"],
  "Кыргыз адабияты":["📖","✒","ЫР","📚","✎","★"],

  "Орус тили":["А","Я","СЛОВО","✎","📖","Ъ"],
  "Орус адабияты":["📖","✒","РОМАН","📚","✎","★"],

  "Англис тили":["ABC","A","B","C","HELLO","✎"],

  "Информатика":["</>","01","💻","AI","{}","⌨"],

  "Астрономия":["☀","★","🌙","🪐","∞","☄"],

  "Адам жана коом":["⚖","👥","🏛","🤝","✓","§"],

  "Жаратылыш таануу":["🌿","🌍","☀","💧","🍃","☁"],

  "Экология":["♻","🌿","🌍","💧","☀","🍃"],

  "Экономика":["₽","$","₸","📈","%","Σ"],

  "Укук":["⚖","§","✓","🏛","📜","🔒"],

  "Музыка":["♪","♫","♬","🎵","𝄞","🎼"],

  "Көркөм өнөр":["✦","◯","△","◇","✎","🎨"],

  "Дене тарбия":["🏃","⚽","🏀","🏐","🏆","⏱"],

  "Технология":["⚙","🔧","💡","📐","⚙","✓"]

};

const slideEl =
document.getElementById("slide");

const subjectLabel =
document.getElementById("subjectLabel");

const slideNumber =
document.getElementById("slideNumber");

const title =
document.getElementById("title");

const points =
document.getElementById("points");

const mainSymbol =
document.getElementById("mainSymbol");

const dots =
document.getElementById("dots");

const viewer =
document.getElementById("viewer");

const errorBox =
document.getElementById("errorBox");

const pdfBtn =
document.getElementById("pdfBtn");


function getSymbol(index){

  const list =
  subjectSymbols[subject] ||
  ["★","✦","◆","●","▲","✓"];

  return list[
    index % list.length
  ];
}


function showError(message){

  viewer.style.display =
  "none";

  document.querySelector(
    ".controls"
  ).style.display =
  "none";

  errorBox.style.display =
  "block";

  errorBox.innerHTML = `
    <h2>Презентация ачылган жок</h2>
    <br>
    <p>${message}</p>
    <br>
    <button
      class="back-btn"
      onclick="location.href='index.html'">
      Башкы бетке кайтуу
    </button>
  `;
}


function loadPresentation(){

  try{

    const raw =
    localStorage.getItem(
      "math_ai_presentation"
    );

    if(!raw){

      showError(
        "Презентация табылган жок."
      );

      return false;
    }

    const saved =
    JSON.parse(raw);

    const presentation =
    saved?.presentation
      ? saved.presentation
      : saved;

    if(
      !presentation ||
      !Array.isArray(
        presentation.slides
      ) ||
      !presentation.slides.length
    ){

      showError(
        "Слайддар табылган жок."
      );

      return false;
    }

    slides =
    presentation.slides;

    subject =
    presentation.subject ||
    "Мектеп сабагы";

    return true;

  }
  catch(error){

    console.error(error);

    showError(
      "Презентацияны ачууда ката кетти."
    );

    return false;
  }
}


function renderSlide(){

  if(!slides.length){
    return;
  }

  const current =
  slides[currentIndex];

  slideEl.className =
  "slide variant-" +
  (currentIndex % 5);

  subjectLabel.textContent =
  subject;

  slideNumber.textContent =
  `СЛАЙД ${currentIndex+1} / ${slides.length}`;

  title.textContent =
  current.title ||
  subject;

  points.innerHTML = "";

  const list =
  Array.isArray(current.points)
  ? current.points
  : [];

  list.forEach(text => {

    const li =
    document.createElement(
      "li"
    );

    li.textContent =
    text;

    points.appendChild(li);

  });

  mainSymbol.textContent =
  getSymbol(currentIndex);

  renderDots();
}


function renderDots(){

  dots.innerHTML = "";

  slides.forEach(
    (_,index) => {

      const dot =
      document.createElement(
        "div"
      );

      dot.className =
      index === currentIndex
      ? "dot active"
      : "dot";

      dot.onclick = () => {

        currentIndex =
        index;

        renderSlide();

      };

      dots.appendChild(dot);

    }
  );
}


document.getElementById(
  "prevBtn"
).onclick = () => {

  if(currentIndex > 0){

    currentIndex--;

    renderSlide();

  }
};


document.getElementById(
  "nextBtn"
).onclick = () => {

  if(
    currentIndex <
    slides.length - 1
  ){

    currentIndex++;

    renderSlide();

  }
};


document.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "ArrowRight" &&
      currentIndex <
      slides.length - 1
    ){

      currentIndex++;

      renderSlide();

    }

    if(
      event.key === "ArrowLeft" &&
      currentIndex > 0
    ){

      currentIndex--;

      renderSlide();

    }

  }
);


function createPrintSlides(){

  const area =
  document.getElementById(
    "printArea"
  );

  area.innerHTML = "";

  slides.forEach(
    (slide,index) => {

      const page =
      document.createElement(
        "div"
      );

      page.className =
      "print-slide v" +
      (index % 5);


      const content =
      document.createElement(
        "div"
      );

      content.className =
      "print-content";


      const subjectDiv =
      document.createElement(
        "div"
      );

      subjectDiv.className =
      "print-subject";

      subjectDiv.textContent =
      subject;


      const number =
      document.createElement(
        "div"
      );

      number.className =
      "print-number";

      number.textContent =
      `СЛАЙД ${index+1} / ${slides.length}`;


      const h1 =
      document.createElement(
        "h1"
      );

      h1.textContent =
      slide.title || subject;


      const ul =
      document.createElement(
        "ul"
      );

      const list =
      Array.isArray(slide.points)
      ? slide.points
      : [];

      list.forEach(
        text => {

          const li =
          document.createElement(
            "li"
          );

          li.textContent =
          text;

          ul.appendChild(li);

        }
      );


      content.appendChild(
        subjectDiv
      );

      content.appendChild(
        number
      );

      content.appendChild(
        h1
      );

      content.appendChild(
        ul
      );


      const visual =
      document.createElement(
        "div"
      );

      visual.className =
      "print-visual";

      visual.textContent =
      getSymbol(index);


      page.appendChild(
        content
      );

      page.appendChild(
        visual
      );

      area.appendChild(
        page
      );

    }
  );
}


pdfBtn.addEventListener(
  "click",
  function(){

    if(!slides.length){
      return;
    }

    createPrintSlides();

    pdfBtn.disabled =
    true;

    pdfBtn.textContent =
    "PDF даярдалууда...";

    setTimeout(
      function(){

        window.focus();

        window.print();

        setTimeout(
          function(){

            pdfBtn.disabled =
            false;

            pdfBtn.textContent =
            "PDF сактоо";

          },
          1000
        );

      },
      400
    );

  }
);


window.addEventListener(
  "afterprint",
  function(){

    pdfBtn.disabled =
    false;

    pdfBtn.textContent =
    "PDF сактоо";

  }
);


if(loadPresentation()){

  renderSlide();

}

</script>

</body>
</html>
