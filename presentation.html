<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math AI — Даяр презентация</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #07111f;
      color: white;
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(7, 17, 31, 0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .topbar-inner {
      width: min(1200px, 94%);
      margin: auto;
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      font-size: 24px;
      font-weight: 900;
    }

    .logo span {
      color: #7c9cff;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button,
    .link-btn {
      border: none;
      border-radius: 12px;
      padding: 11px 15px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
    }

    .secondary {
      background: rgba(255,255,255,0.08);
      color: white;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .primary {
      background: linear-gradient(90deg, #5f7cff, #8d62ff);
      color: white;
    }

    .page {
      width: min(1200px, 94%);
      margin: auto;
      padding: 35px 0 70px;
    }

    .page-head {
      margin-bottom: 30px;
    }

    .page-head h1 {
      font-size: clamp(28px, 5vw, 52px);
      margin-bottom: 10px;
    }

    .page-head p {
      color: #91a1b8;
      line-height: 1.6;
    }

    .presentation-info {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill {
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(124,156,255,0.12);
      border: 1px solid rgba(124,156,255,0.18);
      color: #dbe4ff;
      font-size: 13px;
    }

    .slides {
      display: grid;
      gap: 26px;
    }

    .slide-card {
      display: grid;
      grid-template-columns: 80px 1fr;
      gap: 18px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 18px;
    }

    .slide-number {
      width: 62px;
      height: 62px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      font-size: 22px;
      font-weight: 900;
      background: linear-gradient(135deg, #5f7cff, #8d62ff);
      box-shadow: 0 12px 35px rgba(91, 105, 255, 0.25);
    }

    .slide-preview {
      aspect-ratio: 16 / 9;
      width: 100%;
      border-radius: 20px;
      background:
        radial-gradient(circle at top right, rgba(137, 98, 255, 0.25), transparent 30%),
        radial-gradient(circle at bottom left, rgba(95, 124, 255, 0.22), transparent 35%),
        linear-gradient(135deg, #101d31, #0a1423);
      border: 1px solid rgba(255,255,255,0.08);
      padding: clamp(22px, 5vw, 55px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .slide-preview::after {
      content: "";
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 15px;
      pointer-events: none;
    }

    .slide-preview h2 {
      font-size: clamp(24px, 4vw, 44px);
      margin-bottom: 20px;
      max-width: 850px;
      z-index: 2;
    }

    .slide-preview p,
    .slide-preview li {
      color: #c3cee0;
      font-size: clamp(14px, 2vw, 20px);
      line-height: 1.7;
      z-index: 2;
    }

    .slide-preview ul {
      padding-left: 22px;
      display: grid;
      gap: 8px;
    }

    .empty {
      text-align: center;
      padding: 80px 20px;
      border-radius: 24px;
      border: 1px dashed rgba(255,255,255,0.15);
      color: #8fa0b8;
    }

    .empty h2 {
      color: white;
      margin-bottom: 10px;
    }

    .loading {
      text-align: center;
      padding: 70px 20px;
      color: #aab7ca;
    }

    .spinner {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.1);
      border-top-color: #7c9cff;
      margin: 0 auto 18px;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 700px) {
      .topbar-inner {
        padding: 12px 0;
        align-items: flex-start;
        flex-direction: column;
      }

      .slide-card {
        grid-template-columns: 1fr;
      }

      .slide-number {
        width: 50px;
        height: 50px;
        border-radius: 14px;
        font-size: 18px;
      }

      .slide-preview {
        min-height: 330px;
        aspect-ratio: auto;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">
    <div class="topbar-inner">
      <div class="logo">Math<span>AI</span></div>

      <div class="actions">
        <a class="link-btn secondary" href="index.html">
          ← Жаңы презентация
        </a>

        <button class="primary" id="downloadBtn">
          PowerPoint жүктөө
        </button>
      </div>
    </div>
  </div>

  <main class="page">

    <div class="page-head">
      <h1 id="presentationTitle">Даяр презентация</h1>

      <p>
        AI түзгөн слайддарды текшерип көрүңүз.
      </p>

      <div class="presentation-info" id="presentationInfo"></div>
    </div>

    <div id="slidesContainer">

      <div class="loading">
        <div class="spinner"></div>
        Презентация ачылып жатат...
      </div>

    </div>

  </main>

  <script>
    const slidesContainer = document.getElementById("slidesContainer");
    const infoBox = document.getElementById("presentationInfo");
    const titleBox = document.getElementById("presentationTitle");
    const downloadBtn = document.getElementById("downloadBtn");

    function escapeHTML(text) {
      return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function renderPresentation() {
      const saved = localStorage.getItem("math_ai_presentation");

      if (!saved) {
        slidesContainer.innerHTML = `
          <div class="empty">
            <h2>Презентация табылган жок</h2>
            <p>Башкы бетке кайтып, жаңы презентация түзүңүз.</p>
          </div>
        `;
        return;
      }

      let data;

      try {
        data = JSON.parse(saved);
      } catch {
        slidesContainer.innerHTML = `
          <div class="empty">
            <h2>Маалымат ачылган жок</h2>
            <p>Жаңы презентация түзүп көрүңүз.</p>
          </div>
        `;
        return;
      }

      const presentation = data.presentation || data;

      const topic =
        presentation.topic ||
        data.topic ||
        "Математика презентациясы";

      const grade =
        presentation.grade ||
        data.grade ||
        "";

      const language =
        presentation.language ||
        data.language ||
        "";

      const style =
        presentation.style ||
        data.style ||
        "";

      let slides =
        presentation.slides ||
        data.slides ||
        [];

      titleBox.textContent = topic;

      infoBox.innerHTML = `
        ${grade ? `<div class="pill">${escapeHTML(grade)}</div>` : ""}
        ${language ? `<div class="pill">${escapeHTML(language)}</div>` : ""}
        ${style ? `<div class="pill">${escapeHTML(style)} стиль</div>` : ""}
        <div class="pill">${slides.length} слайд</div>
      `;

      if (!Array.isArray(slides) || slides.length === 0) {
        slidesContainer.innerHTML = `
          <div class="empty">
            <h2>Слайддар табылган жок</h2>
            <p>AI жооп бергенден кийин бул жерде даяр слайддар чыгат.</p>
          </div>
        `;
        return;
      }

      slidesContainer.innerHTML = slides.map((slide, index) => {

        const title =
          slide.title ||
          `Слайд ${index + 1}`;

        let content = "";

        if (Array.isArray(slide.points)) {
          content = `
            <ul>
              ${slide.points.map(point =>
                `<li>${escapeHTML(point)}</li>`
              ).join("")}
            </ul>
          `;
        } else if (Array.isArray(slide.content)) {
          content = `
            <ul>
              ${slide.content.map(point =>
                `<li>${escapeHTML(point)}</li>`
              ).join("")}
            </ul>
          `;
        } else {
          content = `
            <p>${escapeHTML(
              slide.content ||
              slide.text ||
              slide.description ||
              ""
            )}</p>
          `;
        }

        return `
          <div class="slide-card">

            <div class="slide-number">
              ${index + 1}
            </div>

            <div class="slide-preview">
              <h2>${escapeHTML(title)}</h2>
              ${content}
            </div>

          </div>
        `;
      }).join("");
    }

    downloadBtn.addEventListener("click", async () => {

      const saved = localStorage.getItem("math_ai_presentation");

      if (!saved) {
        alert("Адегенде презентация түзүңүз.");
        return;
      }

      downloadBtn.disabled = true;
      downloadBtn.textContent = "Даярдалып жатат...";

      try {

        const data = JSON.parse(saved);

        const response = await fetch("/api/powerpoint", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });

        if (!response.ok) {
          throw new Error("PowerPoint даярдалган жок");
        }

        const blob = await response.blob();

        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");

        a.href = url;
        a.download = "math-ai-presentation.pptx";

        document.body.appendChild(a);

        a.click();

        a.remove();

        URL.revokeObjectURL(url);

      } catch (error) {

        alert(
          "PowerPoint функциясын кийинки кадамда кошобуз."
        );

      } finally {

        downloadBtn.disabled = false;
        downloadBtn.textContent = "PowerPoint жүктөө";

      }

    });

    renderPresentation();
  </script>

</body>
</html>
